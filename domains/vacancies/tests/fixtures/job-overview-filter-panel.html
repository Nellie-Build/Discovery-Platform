<html>
<head>
  <title>Vacatures - CareerSite</title>
  <meta property="og:site_name" content="CareerSite"/>
</head>
<body>
  <header><h1>CareerSite</h1></header>
  <main>
    <h1>Vacatures</h1>
    <p>Selecteer hier jouw filters om jouw zoekresultaat te verfijnen.</p>
    <fieldset>
      <legend>Vakgebied</legend>
      <ul>
        <li><label><input type="checkbox"/>Administratief/secretarieel</label></li>
        <li><label><input type="checkbox"/>Agrarisch</label></li>
        <li><label><input type="checkbox"/>ICT</label></li>
        <li><label><input type="checkbox"/>Juridisch</label></li>
        <li><label><input type="checkbox"/>Onderwijs/opleiding</label></li>
        <li><label><input type="checkbox"/>Techniek/productie</label></li>
      </ul>
      <legend>Werk-/Denkniveau</legend>
      <ul>
        <li><label><input type="checkbox"/>Wo</label></li>
        <li><label><input type="checkbox"/>Hbo</label></li>
        <li><label><input type="checkbox"/>Mbo</label></li>
      </ul>
      <legend>Dienstverband</legend>
      <ul>
        <li><label><input type="checkbox"/>Vast dienstverband</label></li>
        <li><label><input type="checkbox"/>Tijdelijk dienstverband</label></li>
        <li><label><input type="checkbox"/>Trainee</label></li>
      </ul>
    </fieldset>
    <p>Het vacature overzicht wordt geladen...</p>
  </main>
</body>
</html>
